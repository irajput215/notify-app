[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "typer>=0.27.2,<1.0.0",
    "zizmor>=1.30.1",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/lib/api/schema.d.ts",
    "frontend/openapi.json",
    "frontend/package-lock.json",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
    # Unicode code points and ranges in @font-face `unicode-range` (U+0100-02BA)
    "U\\+[0-9A-Fa-f?]+(?:-[0-9A-Fa-f]+)?",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
# Standard recovery acronyms, paired as RPO/RTO. typos reads RTO as "TO".
RTO = "RTO"
