# Local development: PostgreSQL, Mailpit (catches every email at http://localhost:8025) and the API.
# The frontend runs on the host with `npm run dev` (see HOW_TO_RUN.md).
services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 10
      timeout: 5s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["bash", "-c", "bash scripts/prestart.sh && fastapi run --reload"]
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-info@example.com}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:3000}
      SEED_DEMO_TENANT: ${SEED_DEMO_TENANT:-false}
      USERS_OPEN_REGISTRATION: ${USERS_OPEN_REGISTRATION:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app

volumes:
  app-db-data:
